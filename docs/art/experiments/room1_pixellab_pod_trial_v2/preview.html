<h1>完整休眠舱 · 像素贴图 v2</h1><p>沿用已确认的 v4.1 造型与开盖。Pixel Canals 是主要视觉质量标杆：几何承担轮廓、遮挡；像素贴图承担结构边缘、材质区别、明暗与表面信息。七类表面全部覆盖，原网格与动作未改。色板、像素密度、材质与屏幕信息仍为审图候选。</p>
<figure class="hero"><img src="evidence/03_pixel_shading_same_camera.png"><figcaption>主候选 · 完整像素贴图 + 三档受控明暗，1440×1000原镜头。画面的结构与材质信息来自贴图；造型未改。</figcaption></figure>
