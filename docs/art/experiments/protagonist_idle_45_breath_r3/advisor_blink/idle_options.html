const A=document.getElementById('A'),B=document.getElementById('B'),C=document.getElementById('C');
let bodyB=BASE; let blinking={A:false,B:false};
function show(){ A.src=blinking.A?BL:BASE; B.src=(blinking.B&&bodyB===BASE)?BL:bodyB; }
function blinkLoop(k){ const wait=3000+Math.random()*2200; setTimeout(()=>{ const dbl=Math.random()<0.25;
  const seq=dbl?[130,110,130]:[130]; let i=0;
  const step=()=>{ if(i>=seq.length){blinking[k]=false;show();blinkLoop(k);return}
    blinking[k]=(i%2===0); show(); setTimeout(step,seq[i]); i++; };
  step(); },wait); }
function shoulderLoop(){ bodyB=BASE; show(); setTimeout(()=>{ bodyB=SH; show(); setTimeout(shoulderLoop,1300); },1500); }
function waveLoop(){ const seq=[[BASE,1000],[W2,500],[W3,900],[W2,250]]; let i=0; const st=()=>{C.src=seq[i][0];const t=seq[i][1];i=(i+1)%seq.length;setTimeout(st,t)}; st(); }
show(); blinkLoop('A'); blinkLoop('B'); shoulderLoop(); waveLoop();
