const seq=[['f0',900],['f1',450],['f2',500],['f3',600],['f4',350],['f5',300]];
let cur='f0', blinkR=false, blinkA=false;
const R=document.getElementById('R'), A=document.getElementById('A');
function show(){ R.src=F[cur+(blinkR?'b':'')]; A.src=F['f0'+(blinkA?'b':'')]; }
function breathe(){ let i=0; const st=()=>{ cur=seq[i][0]; show(); const t=seq[i][1]; i=(i+1)%seq.length; setTimeout(st,t) }; st(); }
function blink(set){ setTimeout(()=>{ const dbl=Math.random()<0.25; const s=dbl?[130,110,130]:[130]; let i=0;
  const st=()=>{ if(i>=s.length){ set(false); show(); blink(set); return } set(i%2===0); show(); setTimeout(st,s[i]); i++ }; st(); },3000+Math.random()*2200); }
show(); breathe(); blink(v=>blinkR=v); blink(v=>blinkA=v);
</script></body></html>
