<h1>Room 1 主门：门框收敛与旧化贴图 v6</h1>
<p>同一 Godot 镜头、1280 × 720。v3 是结构及灯语基准，v5 是上一版做旧候选，v6 只调整待机收边、门叶侧面与像素旧化；门尺寸、滑动、碰撞、房间布局和照明保持 v3。</p>
<h2>关闭状态对比</h2><section>
<figure><img src="../room1_integrated_door_v3/evidence/idle_closed.png" alt="v3 原状态"><figcaption>v3 基准：门框侧面过黑，门叶做旧主要集中在底部</figcaption></figure>
<figure><img src="../room1_integrated_door_surface_v5/evidence/idle_closed.png" alt="v5 上一版"><figcaption>v5：去掉底部大块痕迹后，整体过于平净</figcaption></figure>
<figure><img src="evidence/idle_closed.png" alt="v6 当前候选"><figcaption>v6：弱化待机框；沉积与磨耗回到上密封条、滑动侧边和小窗凹口</figcaption></figure>
</section>
<h2>通行与反馈</h2><section>
<figure><img src="evidence/yellow_scanning.png" alt="认证黄灯"><figcaption>认证中：仅小窗黄色</figcaption></figure>
<figure><img src="evidence/green_opening.png" alt="绿灯与滑门"><figcaption>通行中：四边绿灯保持，门叶侧面与贴图同色系</figcaption></figure>
<figure><img src="evidence/green_open.png" alt="门开启"><figcaption>门开启：通道有效期间绿灯仍亮</figcaption></figure>
<figure><img src="evidence/red_denied_window_only.png" alt="拒绝红灯"><figcaption>拒绝：只有小窗红色，不出现红色门框</figcaption></figure>
</section>
