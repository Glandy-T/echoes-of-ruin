<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room 1 整室墙地候选 r1</title><style>body{margin:0;background:#202828;color:#e2e5da;font:16px/1.65 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:27px}h2{font-size:21px;margin-top:32px}p{color:#bfc8c1}a{color:#afd1d4}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}img{display:block;width:100%}figcaption{padding:7px 0}.note{border-left:3px solid #a9bcb4;padding:12px 16px;background:#2d3835}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{background:#34423d;color:#e1e7dc;padding:9px 15px;border:1px solid #64786b;border-radius:3px;cursor:pointer}button[aria-pressed=true]{background:#b6c9b9;color:#18211b}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><main><h1>Room 1 / 整室墙地候选 r1</h1><p>统一蓝灰地坪；墙面主面保持简洁，像素变化集中在真实交界。沿用r4照明与布局，新增独立场景审图。</p><p><a href="README.md">处理与限制说明</a> · <a href="../../../../scenes/dev/room1_surface_full_room_r1.tscn">Godot场景</a> · <a href="../room1_wall_finish_r4/preview.html">r4修复基线</a></p><p class="note">材质候选，尚未替换原场景。镜像采样仍有周期；新固有色的间接反射尚未重烘焙。以下均为原曝光、原1280×720实际画面。</p><div class="controls" id="views"><button onclick="setView(1,this)" aria-pressed="true">左侧机位</button><button onclick="setView(2,this)" aria-pressed="false">中央机位</button><button onclick="setView(3,this)" aria-pressed="false">右侧机位</button></div><div class="controls" id="modes"><button onclick="setMode('baseline',this)" aria-pressed="false">原材质</button><button onclick="setMode('wall',this)" aria-pressed="false">只换墙</button><button onclick="setMode('floor',this)" aria-pressed="false">只换地面</button><button onclick="setMode('both',this)" aria-pressed="true">整室墙地</button></div><a id="heroLink" href="evidence/01_both.png"><img id="hero" src="evidence/01_both.png"></a><h2>左侧同机位 · 原材质 / 候选</h2><div class="pair"><figure><a href="evidence/01_baseline.png"><img src="evidence/01_baseline.png"></a><figcaption>原材质，r4照明</figcaption></figure><figure><a href="evidence/01_both.png"><img src="evidence/01_both.png"></a><figcaption>墙地候选，同一照明</figcaption></figure></div><h2>中央同机位 · 原材质 / 候选</h2><div class="pair"><figure><a href="evidence/02_baseline.png"><img src="evidence/02_baseline.png"></a><figcaption>原材质，r4照明</figcaption></figure><figure><a href="evidence/02_both.png"><img src="evidence/02_both.png"></a><figcaption>墙地候选，同一照明</figcaption></figure></div><h2>右侧同机位 · 原材质 / 候选</h2><div class="pair"><figure><a href="evidence/03_baseline.png"><img src="evidence/03_baseline.png"></a><figcaption>原材质，r4照明</figcaption></figure><figure><a href="evidence/03_both.png"><img src="evidence/03_both.png"></a><figcaption>墙地候选，同一照明</figcaption></figure></div><details><summary>更高材质变化强度 · 非默认</summary><a href="evidence/04_stronger_variation.png"><img src="evidence/04_stronger_variation.png"></a><p>用于比较强度，不作为默认效果。</p></details><h2>整室巡检 · 13机位</h2><p>四墙角、门洞、通道与全部20舱；技术相机仅用于检查。</p><div class="pair"><figure><a href="survey/01_game.png"><img loading="lazy" src="survey/01_game.png"></a><figcaption>01_game</figcaption></figure><figure><a href="survey/02_game.png"><img loading="lazy" src="survey/02_game.png"></a><figcaption>02_game</figcaption></figure><figure><a href="survey/03_game.png"><img loading="lazy" src="survey/03_game.png"></a><figcaption>03_game</figcaption></figure><figure><a href="survey/04_game.png"><img loading="lazy" src="survey/04_game.png"></a><figcaption>04_game</figcaption></figure><figure><a href="survey/05_game.png"><img loading="lazy" src="survey/05_game.png"></a><figcaption>05_game</figcaption></figure><figure><a href="survey/06_game.png"><img loading="lazy" src="survey/06_game.png"></a><figcaption>06_game</figcaption></figure><figure><a href="survey/07_rear_left.png"><img loading="lazy" src="survey/07_rear_left.png"></a><figcaption>07_rear_left</figcaption></figure><figure><a href="survey/08_rear_right.png"><img loading="lazy" src="survey/08_rear_right.png"></
