<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>走廊烘焙 v2 实际效果</title>
<style>body{max-width:1320px;margin:30px auto;padding:0 22px;background:#142022;color:#dce6e4;font:16px/1.7 system-ui}h1{font-size:28px}button,select{font:inherit;padding:8px 13px;margin:4px;background:#2b4548;border:1px solid #789391;color:inherit;border-radius:5px}img{display:block;width:100%;height:auto;image-rendering:pixelated}a{color:#a0d4d1}figure{margin:20px 0}small{color:#afc1bd}</style>
<h1>4F走廊 · 配套烘焙 v2</h1><p>室内r24墙板＋r26地坪，使用独立UV2与Cycles烘焙；临时实时补光关闭。当前范围是3.2m小样，其他区域仍为灰盒。</p><p>F6：scenes/dev/cryo_corridor_baked_v2.tscn · E认证 · F8到小样 · F9灯带 · F10原始／降噪。<a href="README.md">制作及检查记录</a></p>
<select id="view" aria-label="机位"><option value="game">实际游戏镜头</option><option value="north_wall">北侧完整墙</option><option value="south_wall">南侧完整墙</option><option value="floor">完整地坪</option><option value="west_wall_feet">西北墙脚</option><option value="east_wall_feet">东南墙脚</option><option value="north_east_foot">东北墙脚</option><option value="south_west_foot">西南墙脚</option><option value="lamp_close">灯带近景</option></select><button onclick="show('raw')">原始光图</button><button onclick="show('denoised')">降噪光图</button><figure><img id="main" src="evidence/denoised_game.png" alt="烘焙后实际游戏镜头"><figcaption id="label"></figcaption></figure>
<h2>与临时实时补光比较</h2><p><small>同一游戏机位；纸片角色不属于本次静态烘焙对象。</small></p><button onclick="document.getElementById('compare').src='evidence/previous_realtime_game.png'">之前实时补光</button><button onclick="document.getElementById('compare').src='evidence/denoised_game.png'">配套烘焙</button><img id="compare" src="evidence/denoised_game.png" alt="临时补光与烘焙比较">
<h2>开关与恢复</h2><button onclick="power('on_wall')">开灯</button><button onclick="power('off_wall')">关灯</button><button onclick="power('restored_wall')">恢复</button><img id="power" src="evidence/on_wall.png" alt="烘焙灯带开关检查">
<details><summary>线性HDR光图预览（共同显示转换）</summary><img src="evidence/raw_atlas.png" alt="原始共享图集"><img src="evidence/denoised_atlas.png" alt="降噪共享图集"></details>
<script>let mode='denoised';const view=document.getElementById('view');function show(m){mode=m;document.getElementById('main').src='evidence/'+mode+'_'+view.value+'.png';document.getElementById('label').textContent=(mode==='raw'?'原始':'降噪')+' · '+view.options[view.selectedIndex].text+' · 1280×720'}view.onchange=()=>show(mode);function power(n){document.getElementById('power').src='evidence/'+n+'.png'}show(mode);</script></html>
