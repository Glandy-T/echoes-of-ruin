<svg xmlns="http://www.w3.org/2000/svg" xmlns:freecad="http://www.freecadweb.org/wiki/index.php?title=Svg_Namespace" width="594mm" height="420mm" viewBox="0 0 594 420"><rect width="594" height="420" fill="white" /><rect x="12" y="12" width="570" height="396" stroke="#111" stroke-width="0.45" fill="none" /><text x="22" y="26" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">ECHOES OF RUIN / 管理设施空间验证</text><text x="22" y="36" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">工作人员区尺寸 / TBD 待确认清单</text><text x="22" y="46" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">尺寸单位 m；约值为当前验证基准。实线为有依据的尺寸线；虚线/关系符号不构成定位。</text><line x1="12" y1="374" x2="582" y2="374" stroke="#111" stroke-width="0.4" fill="none" /><line x1="360" y1="374" x2="360" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><line x1="475" y1="374" x2="475" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><line x1="533" y1="374" x2="533" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><text x="20" y="383" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">依据：CRYO_FACILITY_LAYOUT.md §§4-6 + 本轮用户两张草图</text><text x="20" y="391" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">GitHub main 核对：2026-10-06 / commit 8bc29124bacb / 修订 v1</text><text x="20" y="400" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">状态：空间验证首版；未知工程条件统一 TBD；导出为参数快照。</text><text x="368" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">比例 / 打印 A2 100%</text><text x="368" y="395" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">ST01 1:200；清单 NTS</text><text x="483" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">图号</text><text x="483" y="398" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">A104</text><text x="541" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">版本</text><text x="541" y="398" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">v1</text><text x="25" y="66" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">只列影响本轮管理设施工程平面的事项；没有以建筑经验补齐任何未定值。</text><rect x="50" y="93" width="90.0" height="60.0" stroke="#111" stroke-width="0.5" fill="none" /><line x1="50" y1="93" x2="50" y2="83" stroke="#111" stroke-width="0.18" fill="none" /><line x1="140.0" y1="93" x2="140.0" y2="83" stroke="#111" stroke-width="0.18" fill="none" /><line x1="50" y1="85" x2="140.0" y2="85" stroke="#111" stroke-width="0.2" fill="none" /><line x1="48.9" y1="86.1" x2="51.1" y2="83.9" stroke="#111" stroke-width="0.3" fill="none" /><line x1="138.9" y1="86.1" x2="141.1" y2="83.9" stroke="#111" stroke-width="0.3" fill="none" /><text x="95.0" y="83" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="middle" fill="#111111">≈ 18 m</text><line x1="50" y1="93" x2="44" y2="93" stroke="#111" stroke-width="0.18" fill="none" /><line x1="50" y1="153.0" x2="44" y2="153.0" stroke="#111" stroke-width="0.18" fill="none" /><line x1="42" y1="93" x2="42" y2="153.0" stroke="#111" stroke-width="0.2" fill="none" /><line x1="40.9" y1="94.1" x2="43.1" y2="91.9" stroke="#111" stroke-width="0.3" fill="none" /><line x1="40.9" y1="154.1" x2="43.1" y2="151.9" stroke="#111" stroke-width="0.3" fill="none" /><text x="39" y="123.0" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="end" fill="#111111">≈ 12 m</text><text x="95.0" y="162.0" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="middle" fill="#111111">ST01 工作人员区 / XY、边界控制面 TBD</text><text x="170" y="93" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">18×12m：本轮用户明确确认。</text><text x="170" y="100" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">升降台在该区后侧中央相对位置，3×3m；精确XY未定。</text><text x="170" y="107" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">草图楼梯在岛两端，文档要求边侧封闭疏散楼梯。</text><text x="170" y="114" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">后续定位需先解决该冲突；本版没有新增走道或井道尺寸。</text><text x="26" y="180" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T01</text><text x="47" y="180" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">墙与结构</text><text x="138" y="180" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">墙厚、墙体类型、内外表面定义；柱网、柱截面、结构与防火分隔。</text><line x1="24" y1="185" x2="571" y2="185" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="193" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T02</text><text x="47" y="193" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">1F 十入口</text><text x="138" y="193" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">A-J顺序和宽2.5m见草图；各门中心X、宽度控制面、洞高、门型/开启方式未定。</text><line x1="24" y1="198" x2="571" y2="198" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="206" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T03</text><text x="47" y="206" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">自动认证</text><text x="138" y="206" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">认证区进深、闸机尺寸/数量、通道宽和异常分流位置。</text><line x1="24" y1="211" x2="571" y2="211" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="219" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T04</text><text x="47" y="219" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">1F 三后出口</text><text x="138" y="219" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">草图宽6/8/6m；三门中心X、宽度控制面、洞高、门型；不绑定楼栋。</text><line x1="24" y1="224" x2="571" y2="224" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="232" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T05</text><text x="47" y="232" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">工作人员岛</text><text x="138" y="232" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">18×12m由用户确认；精确XY、边界控制面、区域围护/出入口TBD。</text><line x1="24" y1="237" x2="571" y2="237" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="245" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T06</text><text x="47" y="245" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">升降台</text><text x="138" y="245" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">后侧中央区域内的精确 XY、井道/外围护、上下口方向和平台净尺寸定义。</text><line x1="24" y1="250" x2="571" y2="250" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="258" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T07</text><text x="47" y="258" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">疏散楼梯</text><text x="138" y="258" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">草图在岛两端，文档要求建筑边侧封闭楼梯；按文档。位置/数量/全部构造TBD。</text><line x1="24" y1="263" x2="571" y2="263" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="271" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T08</text><text x="47" y="271" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">上下层对位</text><text x="138" y="271" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2F 相对 1F 的 X/Y 偏移、准确楼面标高、楼板厚度；草图没有定位尺寸。</text><line x1="24" y1="276" x2="571" y2="276" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="284" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T09</text><text x="47" y="284" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2F 工位定位</text><text x="138" y="284" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">阵列在 2F 的坐标与朝向；范围内实际通道值；桌面、椅子与模块内部位置。</text><line x1="24" y1="289" x2="571" y2="289" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="297" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T10</text><text x="47" y="297" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">双屏与主屏</text><text x="138" y="297" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">各显示器物理尺寸/支架；主屏实际宽高、墙位、厚度、安装标高。</text><line x1="24" y1="302" x2="571" y2="302" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="310" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T11</text><text x="47" y="310" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2F 配套</text><text x="138" y="310" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">卫生间具体边角、门洞/围护/洁具；柜列墙位、柜数、朝向及操作净距。</text><line x1="24" y1="315" x2="571" y2="315" stroke="#111" stroke-width="0.15" fill="none" /><text x="26" y="323" font-size="3.5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T12</text><text x="47" y="323" font-size="3.4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">导视与公共卫生间</text><text x="138" y="323" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">导视具体位置/占地；1F 公共/无障碍卫生间是否设置及尺寸。</text><line x1="24" y1="328" x2="571" y2="328" stroke="#111" stroke-width="0.15" fill="none" /><text x="25" y="338" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">所有 CAD 尺寸内部单位为 mm，导出图用 m；约值为验证基准而非最终建造公差。</text><text x="25" y="345" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">零件和范围阵列有各自局部原点；未填写的建筑定位不是 (0,0)。</text><text x="25" y="352" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2F 相对 1F 偏移、精确楼面标高、楼梯/升降台定位未确认，故未生成虚假的上下层3D对位。</text></svg>