操作间距</text><text x="144" y="122" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">0.70 m 净</text><text x="277" y="122" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">目标值</text><text x="34" y="133" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">左右墙边余量</text><text x="144" y="133" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">各 0.95 m</text><text x="277" y="133" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">净尺寸 / 最外底座</text><text x="34" y="144" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">前后墙边 / 入口缓冲</text><text x="144" y="144" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">各 0.50 m / 后侧0.50 m</text><text x="277" y="144" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">不是回转前室</text><text x="34" y="155" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">墙厚 / 唯一后门净宽</text><text x="144" y="155" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">0.20 / 1.60 m</text><text x="277" y="155" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">PROVISIONAL</text><text x="30" y="175" font-size="4" font-family="SimSun,serif" text-anchor="start" fill="#222">02 反算依据 / 同一布局的尺寸敏感性</text><text x="30" y="187" font-size="3.2" font-family="SimSun,serif" text-anchor="start" fill="#222">W = 2t + 2边余量 + 2(5舱宽 + 4舱间距) + 1.60；D = 2t + 2端余量 + 2×2.30 + 3.50。</text><text x="30" y="199" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">下表比较假设：墙0.20、舱间0.70、侧边余量目标≥0.70、端余量目标≥0.50 m；后两项为本轮测试口径。</text><line stroke="#aaa" stroke-width="0.12" fill="none" x1="30" y1="209" x2="30" y2="281" /><line stroke="#aaa" stroke-width="0.12" fill="none" x1="141" y1="209" x2="141" y2="281" /><line stroke="#aaa" stroke-width="0.12" fill="none" x1="236" y1="209" x2="236" y2="281" /><line stroke="#aaa" stroke