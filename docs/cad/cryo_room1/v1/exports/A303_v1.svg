.50</text><text x="428" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">可容纳1.10 m宽舱</text><text x="30" y="299" font-size="3.3" font-family="SimSun,serif" text-anchor="start" fill="#222">结论：1.05 m宽舱在19.5×9.5 m可满足本轮测试余量；20×9.5 m兼容1.10 m宽舱，保留为本版P方案。</text><text x="30" y="315" font-size="4" font-family="SimSun,serif" text-anchor="start" fill="#222">03 原生几何验证 / 范围与来源</text><text x="30" y="328" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">20舱 / 四区各5；实体碰撞0；20个舱外包原生回读一致；原生草图全部约束；参数联动另见QA报告。</text><text x="30" y="340" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">只核验静态闭舱实尺。盖板开启扫掠、人体转身、维修搬运、消防与室内净高仍为待验证项。</text><text x="30" y="352" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">来源：GitHub main / fcc0863（2026-10-07）；ROOM1_ENGINEERING_BRIEF + CRYO_FACILITY_LAYOUT。</text><text x="30" y="364" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">草稿按空间关系参考；旧19×8.5、右侧门、双舱分组已被最新简报替代。A301-A303为参数快照。</text><text x="30" y="376" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">本版只绘制单室；标准层、整栋休眠楼和园区不在本轮输出范围。修改参数后重建排版页。</text></svg>