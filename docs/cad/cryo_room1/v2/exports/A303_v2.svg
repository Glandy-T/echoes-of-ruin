"30" y1="137" x2="565" y2="137" /><line stroke="#aaa" stroke-width="0.12" fill="none" x1="30" y1="148" x2="565" y2="148" /><line stroke="#aaa" stroke-width="0.12" fill="none" x1="30" y1="159" x2="565" y2="159" /><text x="34" y="67" font-size="3.2" font-family="SimSun,serif" text-anchor="start" fill="#222">参数</text><text x="144" y="67" font-size="3.2" font-family="SimSun,serif" text-anchor="start" fill="#222">实际值</text><text x="277" y="67" font-size="3.2" font-family="SimSun,serif" text-anchor="start" fill="#222">状态 / 测量口径</text><text x="34" y="78" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">外包宽 × 深</text><text x="144" y="78" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">21.00 × 9.50 m</text><text x="277" y="78" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">PROVISIONAL</text><text x="34" y="89" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">室内净宽 × 深</text><text x="144" y="89" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">20.60 × 9.10 m</text><text x="277" y="89" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">由外包与墙厚计算</text><text x="34" y="100" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">舱体最大外包</text><text x="144" y="100" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">1.05 × 2.30 × 1.00 m</text><text x="277" y="100" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">W/H暂定；L基准</text><text x="34" y="111" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">中央纵向 / 横向通道</text><text x="144" y="111" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">2.40 P / 3.50 m 净</text><text x="277" y="111" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222">纵向暂定；横向基准</text><text x="34" y="122" font-size="3.0" font-family="SimSun,serif" text-anchor="start" fill="#222