un,serif" text-anchor="start" fill="#222">纵向通道净宽</text><text x="144" y="241" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">1.60</text><text x="239" y="241" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">2.40</text><text x="338" y="241" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">+0.80</text><text x="428" y="241" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">PROVISIONAL</text><text x="33" y="253" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">后门净宽</text><text x="144" y="253" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">1.60</text><text x="239" y="253" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">1.40</text><text x="338" y="253" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">-0.20</text><text x="428" y="253" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">PROVISIONAL</text><text x="33" y="265" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">侧墙净余量 / 每侧</text><text x="144" y="265" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">0.95</text><text x="239" y="265" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">1.05</text><text x="338" y="265" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">+0.10</text><text x="428" y="265" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">由布局反算</text><text x="33" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">前后端净余量 / 每侧</text><text x="144" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">0.50</text><text x="239" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">0.50</text><text x="338" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">保持</text><text x="428" y="277" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">由布局反算</text><text x="30" y="299" font-size="3.1" font-family="SimSun,serif" text-anchor="start" fill="#222">门后两侧展开量 = (2.40 - 1.40) / 2 = 0.50 m。人员门与通道宽度分别确定；舱体更换路径留待背部维护系统。</text><text x="30" y="315" font-size="4" font-family="SimSun,serif" text-anchor="start" fill="#222">03 原生几何验证 / 范围与来源</text><text x="30" y="328" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">20舱 / 四区各5；实体碰撞0；20个舱外包原生回读一致；原生草图全部约束；参数联动另见QA报告。</text><text x="30" y="340" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">只核验静态闭舱实尺。盖板开启扫掠、人体转身、维修搬运、消防与室内净高仍为待验证项。</text><text x="30" y="352" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">来源：GitHub main / 6ddc2dd（2026-10-07）；ROOM1_ENGINEERING_BRIEF v2决策 + CRYO_FACILITY_LAYOUT。</text><text x="30" y="364" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">80个舱体分层与v1平移对齐后逐一校验形状；原生参数联动、尺寸回读和实体碰撞详见QA报告。</text><text x="30" y="376" font-size="3" font-family="SimSun,serif" text-anchor="start" fill="#222">本版只绘制单室；标准层、整栋休眠楼和园区不在本轮输出范围。修改参数后重建排版页。</text></svg>