<svg xmlns="http://www.w3.org/2000/svg" xmlns:freecad="http://www.freecadweb.org/wiki/index.php?title=Svg_Namespace" width="594mm" height="420mm" viewBox="0 0 594 420"><rect width="594" height="420" fill="white" /><rect x="12" y="12" width="570" height="396" stroke="#111" stroke-width="0.45" fill="none" /><text x="22" y="27" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">ECHOES OF RUIN / 管理设施单层空间验证</text><text x="22" y="37" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">面积复核 / 吞吐条件 / TBD 集中问题</text><text x="22" y="47" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">单位 m；实线尺寸为已确认基准。虚线、关系符号与历史草图参考均不可量取定位。</text><line x1="12" y1="374" x2="582" y2="374" stroke="#111" stroke-width="0.4" fill="none" /><line x1="360" y1="374" x2="360" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><line x1="475" y1="374" x2="475" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><line x1="533" y1="374" x2="533" y2="408" stroke="#111" stroke-width="0.35" fill="none" /><text x="20" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">依据：CRYO_FACILITY_LAYOUT.md §§4-5；GitHub main d67e58a89410</text><text x="20" y="393" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">状态：v2 单层验证；图页/导出为参数快照；位置/构造/吞吐 TBD。</text><text x="368" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">比例 / A2 100%</text><text x="368" y="397" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">表格与公式 NTS</text><text x="483" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">图号</text><text x="483" y="398" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">A203</text><text x="541" y="384" font-size="3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">版本</text><text x="541" y="398" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">v2</text><text x="30" y="70" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">面积复核（模型 AreaReview 由表达式驱动；本页为当前参数快照）</text><rect x="30" y="81" width="390" height="13" stroke="#111" stroke-width="0.25" fill="none" /><text x="40" y="90" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">外包毛面积</text><text x="185" y="90" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2,925 m²</text><text x="275" y="90" font-size="2.8" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">65×45m 当前验证基准</text><rect x="30" y="97" width="390" height="13" stroke="#111" stroke-width="0.25" fill="none" /><text x="40" y="106" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">工作人员区</text><text x="185" y="106" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">216 m²</text><text x="275" y="106" font-size="2.8" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">18×12m 已确认</text><rect x="30" y="113" width="390" height="13" stroke="#111" stroke-width="0.25" fill="none" /><text x="40" y="122" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">未分配毛面积差额</text><text x="185" y="122" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">2,709 m²</text><text x="275" y="122" font-size="2.8" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">含大厅、认证、待定厕所、墙体等；非闲置净面积</text><text x="30" y="157" font-size="3.6" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">吞吐验证：尚无结论。先收集下列输入，才可计算而非凭门数或行业经验猜测。</text><text x="42" y="176" font-size="3.15" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">• Q_peak = 高峰到达人数 / 时间窗</text><text x="42" y="184" font-size="3.15" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">• 每入口组能力 = 并行闸机数量 × 单闸机服务率</text><text x="42" y="192" font-size="3.15" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">• 后出口能力 = 各出口有效净宽与步行流量关系（待选定）</text><text x="42" y="200" font-size="3.15" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">• 平衡条件：认证总处理能力 ≥ Q_peak；出口总处理能力 ≥ Q_peak</text><text x="42" y="208" font-size="3.15" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">• 还需：分配到场曲线、异常比例、认证失败处理时间、候流可用面积与安全条件。</text><text x="30" y="246" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">TBD 集中问题</text><text x="32" y="263" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T01</text><text x="59" y="263" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">外包与结构</text><text x="143" y="263" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">最终外包尺寸、墙厚、结构与构造控制面 TBD；65×45 m 仅为当前可编辑验证基准。</text><line x1="30" y1="267" x2="565" y2="267" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="273" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T02</text><text x="59" y="273" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">工作人员区</text><text x="143" y="273" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">18×12 m 是用户确认的概念分区边界；精确 XY、边界、出入口与内部工位 TBD。</text><line x1="30" y1="277" x2="565" y2="277" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="283" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T03</text><text x="59" y="283" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">中央内部厕所</text><text x="143" y="283" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">原升降台关系位置已知；尺寸、洁具、门、边界和控制面 TBD。</text><line x1="30" y1="287" x2="565" y2="287" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="293" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T04</text><text x="59" y="293" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">左右公共厕所</text><text x="143" y="293" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">面积、位置、厕位、无障碍配置、边界及门 TBD。</text><line x1="30" y1="297" x2="565" y2="297" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="303" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T05</text><text x="59" y="303" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">入口组与认证</text><text x="143" y="303" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">入口组净宽、中心 X、闸机数量、认证进深、排队与异常分流 TBD。</text><line x1="30" y1="307" x2="565" y2="307" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="313" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T06</text><text x="59" y="313" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">后出口</text><text x="143" y="313" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">三个出口的净宽、中心 X、门型、控制面及通往园区的流线 TBD。</text><line x1="30" y1="317" x2="565" y2="317" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="323" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T07</text><text x="59" y="323" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">吞吐输入</text><text x="143" y="323" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">峰值到场率、各组服务率、出口实测流率、停留时间与分流比例 TBD；无这些输入不能给出吞吐结论。</text><line x1="30" y1="327" x2="565" y2="327" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="333" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T08</text><text x="59" y="333" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">导视与工作人员工位</text><text x="143" y="333" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">导视占地，以及工作人员监控/日志工位实际需要与数量 TBD。</text><line x1="30" y1="337" x2="565" y2="337" stroke="#111" stroke-width="0.14" fill="none" /><text x="32" y="343" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">T09</text><text x="59" y="343" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">标高与屋面</text><text x="143" y="343" font-size="2.65" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">准确标高、屋面及层高范围控制面 TBD。</text><line x1="30" y1="347" x2="565" y2="347" stroke="#111" stroke-width="0.14" fill="none" /><text x="30" y="367" font-size="2.9" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111111">未选择墙厚、门宽、厕位、闸机、结构或任何默认零值。无 2F、楼梯、升降台、十工位、主屏、原 2F 卫生间/柜区。</text></svg>