<svg xmlns="http://www.w3.org/2000/svg" width="594mm" height="420mm" viewBox="0 0 594 420"><rect width="594" height="420" fill="white" /><rect stroke="#111" stroke-width="0.3" fill="none" x="12" y="12" width="570" height="396" /><text x="22" y="27" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">参数与待确认事项（辅助审查页）</text><text x="572" y="27" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="end" fill="#111">A203</text><line stroke="#111" stroke-width="0.25" fill="none" x1="12" y1="34" x2="582" y2="34" /><line stroke="#111" stroke-width="0.25" fill="none" x1="12" y1="388" x2="582" y2="388" /><text x="22" y="399" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">管理设施 | 单层建筑方案 / 空间验证 | v2-R1</text><text x="572" y="399" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="end" fill="#111">不按比例 | 米制尺寸 | 2026-10-06</text><text x="28" y="53" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">已确认 / 当前验证基准</text><text x="28" y="68" font-size="3.3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">单层；A–J十入口；认证后共享大厅；中央工作人员与内部厕所；左右公共厕所；三后出口。</text><text x="28" y="82" font-size="3.3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员区边界18×12 m：用户确认。建筑外包65×45 m：当前验证基准，最终外包待确认。</text><text x="28" y="107" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">本轮 PROVISIONAL 参数</text><text x="28" y="125" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">墙 / 门</text><text x="83" y="125" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">外墙0.30；隔墙0.20；前开口2.50；后开口6 / 8 / 6 m；门型及开启P。</text><text x="28" y="139" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">定位</text><text x="83" y="139" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员X=23.50，Y=21.00；两公共厕所Y=21.00 m，均以外边界定位。</text><text x="28" y="153" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员</text><text x="83" y="153" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">内部厕所外包3×3 m，居中；工作人员门1.20；内部厕所门0.90；2处工作台。</text><text x="28" y="167" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">公共厕所</text><text x="83" y="167" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">每侧外包8×10 m；4普通+1通用；普通净1.60×2.00；通用净3.00×3.00 m。</text><text x="28" y="181" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">认证组</text><text x="83" y="181" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">每组2通道，净宽1.20 / 0.90；条宽0.18、长1.60；前端Y=5.00；净深8.00 m。</text><text x="28" y="195" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">几何余量</text><text x="83" y="195" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">大厅左/右净间距15.20/15.20；前净深12.70；后净深11.70 m；仅是布局结果。</text><line stroke="#111" stroke-width="0.2" fill="none" x1="28" y1="212" x2="566" y2="212" /><text x="28" y="230" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">面积 / 参数修改</text><text x="28" y="245" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">外包面积2925 m²；工作人员边界216 m²（含内部厕所9 m²）；两公共厕所合计160 m²。</text><text x="28" y="258" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">各分区数字为方案边界面积，包含其墙体；不代表净使用面积或容纳人数。</text><text x="28" y="272" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">FreeCAD Parameters内长度/XY直接驱动草图和A204；ParameterTable列出状态与单位。</text><text x="28" y="285" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">出版页为快照；用build_freecad.py --parameters-from 已修改文件.FCStd重建，再运行GUI宏与PDF导出。</text><text x="28" y="310" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">仍需确认 / TBD</text><text x="28" y="325" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">最终外包与各P参数；厕位配置与通用厕间要求；门型/开启；工作人员真实设备与控制范围。</text><text x="28" y="338" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">结构、标高、层高、屋面、机电、防火疏散与适用规范；导视信息及园区出口衔接。</text><text x="28" y="351" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">峰值到场率、认证服务时间、失败分流比例、出口流率及大厅停留时间：未输入，吞吐结论TBD。</text><text x="28" y="373" font-size="2.8" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">依据：CRYO_FACILITY_LAYOUT现行版 / REDRAW_BRIEF；仅几何适配通过，尚未验证法规或运行容量。</text></svg>