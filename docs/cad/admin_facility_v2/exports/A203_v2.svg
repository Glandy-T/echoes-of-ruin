<svg xmlns="http://www.w3.org/2000/svg" width="594mm" height="420mm" viewBox="0 0 594 420"><rect width="594" height="420" fill="white" /><rect stroke="#111" stroke-width="0.3" fill="none" x="12" y="12" width="570" height="396" /><text x="22" y="27" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">参数与收尾验证（辅助审查页）</text><text x="572" y="27" font-size="5" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="end" fill="#111">A203</text><line stroke="#111" stroke-width="0.25" fill="none" x1="12" y1="34" x2="582" y2="34" /><line stroke="#111" stroke-width="0.25" fill="none" x1="12" y1="388" x2="582" y2="388" /><text x="22" y="399" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">管理设施 | 单层建筑方案 / 空间验证 | v2-FINAL</text><text x="572" y="399" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="end" fill="#111">不按比例 | 米制尺寸 | 2026-10-06</text><text x="28" y="53" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">已确认 / 当前验证基准</text><text x="28" y="68" font-size="3.3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">单层；十入口→认证→共享大厅→两侧地图→三后出口；工作人员区有十个双屏工位。</text><text x="28" y="82" font-size="3.3" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">外包65×45 m保留本阶段基准；工作人员区20×14 m与卫生间4.5×4 m均为P。</text><text x="28" y="107" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">本轮 PROVISIONAL 参数</text><text x="28" y="125" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">墙 / 门</text><text x="83" y="125" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">外墙0.30；隔墙0.20；前开口2.50；后开口6 / 8 / 6 m；门型及开启P。</text><text x="28" y="139" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">定位</text><text x="83" y="139" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员X=22.50，Y=20.00；两公共厕所Y=21.00 m，均以外边界定位。</text><text x="28" y="153" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员</text><text x="83" y="153" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">厕所4.5×4 m，后墙居中；2独立隔间+2洗手位；10工位2×5；桌1.80×0.80；纵向节距3.60 m。</text><text x="28" y="167" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">公共厕所</text><text x="83" y="167" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">每侧外包8×10 m；两排6普通+1较大；普通净1.75/2.10×2.20；较大净3.00×3.00 m。</text><text x="28" y="181" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">认证组</text><text x="83" y="181" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">每组2通道，净宽1.20 / 0.90；条宽0.18、长1.60；前端Y=5.00；净深8.00 m。</text><text x="28" y="195" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">通路 / 导视</text><text x="83" y="195" font-size="3.1" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">椅后另留0.60；排间/厕所前1.20/2.20；侧路3.70；地图4×0.15 m，朝前，两旁≥5.10 m。</text><line stroke="#111" stroke-width="0.2" fill="none" x1="28" y1="212" x2="566" y2="212" /><text x="28" y="230" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">面积 / 参数修改</text><text x="28" y="245" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">外包面积2925 m²；工作人员边界280 m²（含内部厕所18 m²）；两公共厕所合计160 m²。</text><text x="28" y="258" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">各分区数字为方案边界面积，包含其墙体；不代表净使用面积或容纳人数。</text><text x="28" y="272" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">FreeCAD Parameters内长度/XY直接驱动草图和A204；ParameterTable列出状态与单位。</text><text x="28" y="285" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">出版页为快照；用build_freecad.py --parameters-from 已修改文件.FCStd重建，再运行GUI宏与PDF导出。</text><text x="28" y="310" font-size="4" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">本阶段空间验证结果</text><text x="28" y="325" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">工作人员区与卫生间适配；十工位、2独立隔间、2洗手位、转身测试及连续通路通过。</text><text x="28" y="338" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">公共厕所两排独立隔间、共享洗手；门扇/洁具/洗手区无冲突；地图与三出口流线保持。</text><text x="28" y="351" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">本阶段空间设计收工；不继续消防、结构、机电或法规深化。P为当前方案测试值。</text><text x="28" y="365" font-size="3.2" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">后续仅保留吞吐验证：到场率、认证时长、失败分流比例、出口流率及停留时间待输入。</text><text x="28" y="381" font-size="2.8" font-family="SimSun, Microsoft YaHei, sans-serif" text-anchor="start" fill="#111">依据：FINAL_PASS优先于旧分区/厕所内容；CRYO_FACILITY_LAYOUT / REDRAW_BRIEF其余关系保持。</text></svg>